    * {
      box-sizing: border-box;

      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background-color: #F6F3EC;
      color: #1E2926;
      font-family: 'Fredoka', system-ui, sans-serif;
      background-image: radial-gradient(rgba(23, 59, 50, 0.065) 2px, transparent 2px);
      background-size: 26px 26px;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    .safe-top {
      padding-top: max(0.65rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
    }
    .touch-card {
      min-height: 72px;
      border-radius: 28px;
      touch-action: manipulation;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, border-color 0.16s ease;
    }
    .touch-card:active {
      transform: scale(0.95);
    }
    .biome-poly {
      cursor: pointer;
      touch-action: manipulation;
      transition: filter 0.2s ease, stroke-width 0.2s ease;
    }
    .biome-active {
      stroke: #173B32 !important;
      stroke-width: 6.5px !important;
      filter: drop-shadow(0 6px 12px rgba(23, 59, 50, 0.32));
    }

    /* Animações suaves e alegres */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes happyHop {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-10px) scale(1.03); }
      70% { transform: translateY(-3px) scale(0.99); }
    }
    @keyframes softWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
      75% { transform: rotate(-3deg); }
    }
    @keyframes speakerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.13); }
    }
    @keyframes starBurst {
      0% { transform: scale(0.2) rotate(0deg); opacity: 1; }
      65% { transform: scale(1.25) rotate(18deg); opacity: 1; }
      100% { transform: scale(0.85) rotate(36deg) translateY(-55px); opacity: 0; }
    }

    .anim-float { animation: floatSlow 2.6s ease-in-out infinite; }
    .anim-hop { animation: happyHop 0.9s ease-in-out infinite; }
    .anim-wiggle { animation: softWiggle 0.5s ease-in-out; }
    .anim-speaker { animation: speakerPulse 1.5s ease-in-out infinite; }
    .star-particle {
      position: fixed;
      pointer-events: none;
      z-index: 80;
      font-size: 2.3rem;
      animation: starBurst 1.15s ease-out forwards;
    }

    /* Cartas do Jogo da Memória (Modalidade 4) */
    .memory-tile {
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      touch-action: manipulation;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease;
    }
    .memory-tile:active {
      transform: scale(0.94);
    }
  </style>
</head>

    /**
     * =========================================================================
     * 3. MOTOR DE VOZ NATURAL & ÁUDIO MOBILE (iOS SAFARI & ANDROID CHROME)
     * - Desbloqueia o áudio no primeiro toque do dedo na tela.
     * - Seleciona automaticamente as vozes neurais/humanas mais naturais em pt-BR.
     * - Faz pausas expressivas entre frases para soar acolhedora e humana.
     * =========================================================================
     */
    const voiceEngine = {
      enabled: true,
      unlocked: false,
      audioCtx: null,
      voices: [],
      selectedVoiceURI: null,
      speakerProfile: 'feminina',
      speechQueueTimer: null,
      speechRequestId: 0,
      lastSpeechStatus: '',

      isSpeechSupported() {
        return 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
      },

      init() {
        // Desbloqueio automático no primeiro toque (essencial no iOS Safari e Android)
        const unlockHandler = () => {
          this.unlockMobileAudio();
          window.removeEventListener('touchstart', unlockHandler);
          window.removeEventListener('pointerdown', unlockHandler);
        };
        window.addEventListener('touchstart', unlockHandler, { passive: true });
        window.addEventListener('pointerdown', unlockHandler, { passive: true });

        if (this.isSpeechSupported()) {
          this.loadVoices();
          window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
        }
      },

      unlockMobileAudio() {
        if (this.unlocked) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            if (!this.audioCtx) this.audioCtx = new AudioContext();
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            // Pulso silencioso para liberar canal de áudio no iOS
            const buf = this.audioCtx.createBuffer(1, 1, 22050);
            const src = this.audioCtx.createBufferSource();
            src.buffer = buf;
            src.connect(this.audioCtx.destination);
            src.start(0);
          }
          this.unlocked = true;
        } catch (e) {
          this.lastSpeechStatus = 'Os efeitos sonoros não puderam ser ativados neste dispositivo.';
        }
      },

      loadVoices() {
        if (!this.isSpeechSupported()) return;
        const allVoices = window.speechSynthesis.getVoices();
        const ptVoices = allVoices.filter(v =>
          (v.lang || '').toLowerCase().includes('pt')
        );

        // Pontuação de naturalidade para priorizar vozes neurais/humanas mais agradáveis
        const scoreVoice = (v) => {
          const name = (v.name || '').toLowerCase();
          const lang = (v.lang || '').toLowerCase();
          let score = 0;
          if (lang.includes('pt-br')) score += 50;
          if (name.includes('natural') || name.includes('neural')) score += 45;
          if (name.includes('francisca') || name.includes('thalita') || name.includes('antonio')) score += 40;
          if (name.includes('luciana') || name.includes('felipe') || name.includes('enhanced') || name.includes('premium')) score += 38;
          if (name.includes('google português do brasil')) score += 35;
          if (name.includes('microsoft')) score += 20;
          if (name.includes('female') || name.includes('feminina') || name.includes('maria') || name.includes('vitoria')) score += 15;
          if (!v.localService) score += 10; // Vozes online neurais costumam soar muito humanas
          return score;
        };

        this.voices = ptVoices.sort((a, b) => scoreVoice(b) - scoreVoice(a));
      },

      getProfileVoice(profile = this.speakerProfile) {
        const voiceNames = {
          feminina: ['female', 'feminina', 'francisca', 'luciana', 'thalita', 'maria', 'camila', 'brenda', 'vitoria', 'victoria', 'gabriela', 'helena', 'sofia'],
          masculina: ['male', 'masculina', 'antonio', 'antônio', 'daniel', 'felipe', 'ricardo', 'bruno', 'joao', 'joão', 'pedro', 'rafael', 'miguel', 'paulo', 'henrique']
        };
        const keywords = voiceNames[profile] || [];
        const matchingVoice = this.voices.find(voice => {
          const name = (voice.name || '').toLowerCase();
          return keywords.some(keyword => name.includes(keyword));
        });
        if (matchingVoice) return matchingVoice;
        if (profile === 'masculina' && this.voices.length > 1) return this.voices[1];
        return this.voices[0] || null;
      },

      getActiveVoice() {
        if (!this.voices.length) this.loadVoices();
        return this.voices.find(v => v.voiceURI === this.selectedVoiceURI) || this.getProfileVoice();
      },

      setSpeakerProfile(profile) {
        if (profile !== 'feminina' && profile !== 'masculina') return;
        this.speakerProfile = profile;
        this.selectedVoiceURI = null;
        this.speak('Olá! Vamos explorar os biomas do Brasil juntos?');
      },

      setVoiceByURI(uri) {
        this.selectedVoiceURI = uri;
        this.speak('Olá! Vamos explorar os biomas do Brasil juntos?');
      },

      setSpeechStatus(message) {
        this.lastSpeechStatus = message;
        const status = document.getElementById('voice-settings-status');
        if (status) status.textContent = message;
        const liveStatus = document.getElementById('voice-live-status');
        if (liveStatus) liveStatus.textContent = message;
      },

      // Efeitos sonoros suaves em timbre de marimba / kalimba (Web Audio API)
      playSound(type) {
        if (!this.enabled) return;
        this.unlockMobileAudio();
        try {
          if (!this.audioCtx) return;
          if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
          const now = this.audioCtx.currentTime;

          const playMarimbaNote = (freq, startOffset, duration = 0.28, volume = 0.14) => {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + startOffset);
            gain.gain.setValueAtTime(0.001, now + startOffset);
            gain.gain.linearRampToValueAtTime(volume, now + startOffset + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + startOffset + duration);
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.start(now + startOffset);
            osc.stop(now + startOffset + duration + 0.02);
          };

          if (type === 'tap') {
            playMarimbaNote(587.33, 0, 0.14, 0.12); // Ré5 suave
          } else if (type === 'flip') {
            playMarimbaNote(440, 0, 0.12, 0.1);
            playMarimbaNote(659.25, 0.06, 0.16, 0.11);
          } else if (type === 'success') {
            // Harpa / marimba alegre ascendente
            playMarimbaNote(523.25, 0.00, 0.35, 0.15); // Dó5
            playMarimbaNote(659.25, 0.09, 0.35, 0.15); // Mi5
            playMarimbaNote(783.99, 0.18, 0.35, 0.15); // Sol5
            playMarimbaNote(1046.5, 0.27, 0.55, 0.17); // Dó6
          } else if (type === 'gentleTry') {
            // "Boing" suave de madeira (nunca assusta a criança)
            playMarimbaNote(330, 0.00, 0.18, 0.11);
            playMarimbaNote(293.66, 0.11, 0.24, 0.11);
          }
        } catch (e) {
          // Fallback silencioso
        }
      },

      // Fala humanizada: divide frases por pontuação para entonação natural e pausas suaves
      speak(fullText) {
        if (!this.enabled) return;
        if (!this.isSpeechSupported()) {
          this.setSpeechStatus('Este navegador não oferece narração por voz. Use uma versão atual do Chrome ou Microsoft Edge.');
          return;
        }
        this.unlockMobileAudio();

        clearTimeout(this.speechQueueTimer);
        const requestId = ++this.speechRequestId;
        const synthesizer = window.speechSynthesis;
        const wasSpeaking = synthesizer.speaking || synthesizer.pending;
        if (wasSpeaking) synthesizer.cancel();

        const sentences = fullText
          .split(/(?<=[!?.])\s+/)
          .map(sentence => sentence.trim())
          .filter(Boolean);
        if (!sentences.length) return;

        const speakNext = (index) => {
          if (requestId !== this.speechRequestId || index >= sentences.length || !this.enabled) return;
          const utterance = new window.SpeechSynthesisUtterance(sentences[index]);
          const selectedVoice = this.getActiveVoice();
          utterance.lang = 'pt-BR';
          if (selectedVoice) utterance.voice = selectedVoice;
          utterance.rate = 0.96;
          utterance.pitch = this.speakerProfile === 'masculina' ? 0.98 : 1.02;
          utterance.volume = 1;

          utterance.onstart = () => this.setSpeechStatus('');
          utterance.onend = () => {
            if (requestId === this.speechRequestId) {
              this.speechQueueTimer = window.setTimeout(() => speakNext(index + 1), 120);
            }
          };
          utterance.onerror = (event) => {
            if (requestId !== this.speechRequestId || event.error === 'canceled' || event.error === 'interrupted') return;
            const message = event.error === 'not-allowed'
              ? 'O navegador bloqueou a narração. Toque novamente em Ouvir para liberar o áudio.'
              : 'Não foi possível iniciar a voz. Confira o volume e as vozes de português do dispositivo.';
            this.setSpeechStatus(message);
          };

          synthesizer.speak(utterance);
        }

        if (wasSpeaking) this.speechQueueTimer = window.setTimeout(() => speakNext(0), 80);
        else speakNext(0);
      }
    };

    /**
     * =========================================================================
     * 4. CONTROLADOR PRINCIPAL DO APP INFANTIL (4 MODALIDADES + MAPA)
     * =========================================================================
     */
    const app = {
      state: {
        screen: 'home', // 'home' | 'map' | 'mode1' | 'mode2' | 'mode3' | 'mode4' | 'celebration'

        lastSpoken: 'Olá, pequeno explorador! Vamos conhecer os bichinhos e as florestas do Brasil? Toque no botão verde para começar!',
        stars: { mode1: false, mode2: false, mode3: false, mode4: false },

        // Modalidade 1 (Casinha)
        m1Index: 0,
        m1Solved: false,
        m1WrongId: null,

        // Modalidade 2 (Lanchinho)
        m2Index: 0,
        m2Solved: false,
        m2WrongId: null,

        // Modalidade 3 (Adivinha / Pistas Sensoriais)
        m3Index: 0,
        m3Solved: false,
        m3WrongId: null,

        // Modalidade 4 (Jogo da Memória 6 cartas / 3 pares)
        m4Cards: [],

        m4Matched: [],
        m4Lock: false
      },

      init() {
        voiceEngine.init();
        this.setupMemoryBoard();
        this.render();
      },

      narrate(text) {
        this.state.lastSpoken = text;
        voiceEngine.speak(text);
      },

      repeatVoice() {
        voiceEngine.playSound('tap');
        voiceEngine.speak(this.state.lastSpoken);
      },

      toggleAudio() {
        voiceEngine.enabled = !voiceEngine.enabled;
        const emoji = document.getElementById('audio-emoji');
        const txt = document.getElementById('audio-text');
        if (voiceEngine.enabled) {
          emoji.textContent = '🔊';
          txt.textContent = 'VOZ';
          voiceEngine.playSound('tap');
          voiceEngine.speak(this.state.lastSpoken);
        } else {
          emoji.textContent = '🔇';
          txt.textContent = 'MUDO';
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }
      },

      burstStars(clientX, clientY) {
        const icons = ['⭐', '🌟', '✨', '💛'];
        const cx = clientX || window.innerWidth / 2;
        const cy = clientY || window.innerHeight / 3;
        for (let i = 0; i < 6; i++) {
          const el = document.createElement('div');
          el.className = 'star-particle';
          el.textContent = icons[i % icons.length];
          el.style.left = `${Math.max(16, Math.min(window.innerWidth - 48, cx + (Math.random() - 0.5) * 150))}px`;
          el.style.top = `${Math.max(40, Math.min(window.innerHeight - 60, cy + (Math.random() - 0.5) * 90))}px`;
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1200);
        }
      },

      updateChrome() {
        const starKeys = ['mode1', 'mode2', 'mode3', 'mode4'];
        starKeys.forEach((k, idx) => {
          const el = document.getElementById(`hdr-star-${idx + 1}`);
          if (el) el.textContent = this.state.stars[k] ? '⭐' : '☆';
        });

        const bottomNav = document.getElementById('bottom-nav');
        if (bottomNav) {
          bottomNav.style.display = this.state.screen === 'home' ? 'none' : 'block';
        }

        ['map', 'mode1', 'mode2', 'mode3', 'mode4'].forEach(tab => {
          const btn = document.getElementById(`tab-${tab}`);
          if (!btn) return;
          if (this.state.screen === tab) {
            btn.className = 'py-2 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 font-bold text-[11px] sm:text-xs bg-naqi-forest text-white shadow';
          } else {
            btn.className = 'py-2 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 font-bold text-[11px] sm:text-xs text-naqi-forest/75 active:bg-naqi-paper';
          }
        });
      },

      goScreen(screenName) {
        voiceEngine.unlockMobileAudio();
        voiceEngine.playSound('tap');
        this.state.screen = screenName;

        if (screenName === 'home') {
          this.render();
          this.narrate('Olá, pequeno explorador! Toque no botão verde Vamos Brincar para começar!');
          return;

        if (screenName === 'map') {
          const b = BIOMES_DATA.find(item => item.id === this.state.selectedBiomeId) || BIOMES_DATA[0];
          this.render();
          this.narrate(`Toque nas cores do mapa para conhecer os bichinhos! ${b.voiceIntro}`);
          return;
        }
        if (screenName === 'mode1') {
          this.state.m1Index = 0;
          this.state.m1Solved = false;
          this.state.m1WrongId = null;
          this.render();
          this.narrate(GAMES_CONFIG.mode1[0].promptVoice);
          return;
        }
        if (screenName === 'mode2') {
          this.state.m2Index = 0;
          this.state.m2Solved = false;
          this.state.m2WrongId = null;
          this.render();
          this.narrate(GAMES_CONFIG.mode2[0].promptVoice);
          return;
        }
        if (screenName === 'mode3') {
          this.state.m3Index = 0;
          this.state.m3Solved = false;
          this.state.m3WrongId = null;
          const animal = ANIMALS_DATA.find(a => a.id === GAMES_CONFIG.mode3[0].animalId);
          this.render();
          this.narrate(`Adivinha quem é! ${animal.sensoryClue}`);
          return;
        }
        if (screenName === 'mode4') {
          this.setupMemoryBoard();
          this.render();
          this.narrate('Jogo da memória! Toque em duas cartinhas para encontrar os bichinhos iguais!');
          return;
        }
        if (screenName === 'celebration') {
          voiceEngine.playSound('success');
          this.render();
          this.burstStars(window.innerWidth / 2, window.innerHeight / 3);
          this.narrate('Parabéns, Pequeno Explorador da Natureza! Você brincou muito bem e conheceu os biomas do Brasil!');
        }
      },

        this.updateChrome();
        const main = document.getElementById('app-main');
        switch (this.state.screen) {
          case 'home': main.innerHTML = this.renderHome(); break;
          case 'map': main.innerHTML = this.renderMap(); break;
          case 'mode1': main.innerHTML = this.renderMode1(); break;
          case 'mode2': main.innerHTML = this.renderMode2(); break;
          case 'mode3': main.innerHTML = this.renderMode3(); break;
          case 'mode4': main.innerHTML = this.renderMode4(); break;
          case 'celebration': main.innerHTML = this.renderCelebration(); break;

       */
      answerMode1(animalId, ev) {
        const round = GAMES_CONFIG.mode1[this.state.m1Index];
        if (this.state.m1Solved) return;

        if (animalId === round.correctId) {
          this.state.m1Solved = true;
          this.state.m1WrongId = null;
          voiceEngine.playSound('success');
          if (ev) this.burstStars(ev.clientX, ev.clientY);
          if (this.state.m1Index === GAMES_CONFIG.mode1.length - 1) {
            this.state.stars.mode1 = true;
          }
          this.render();
          this.narrate(round.winVoice);
        } else {
          const picked = ANIMALS_DATA.find(a => a.id === animalId);
          this.state.m1WrongId = animalId;
          voiceEngine.playSound('gentleTry');
          this.render();
          this.narrate(`Quase! Esse é o ${picked.shortName}. Vamos tentar de novo!`);
        }
      },

      nextMode1() {
        voiceEngine.playSound('tap');
        if (this.state.m1Index + 1 < GAMES_CONFIG.mode1.length) {
          this.state.m1Index++;
          this.state.m1Solved = false;
          this.state.m1WrongId = null;
          this.render();
          this.narrate(GAMES_CONFIG.mode1[this.state.m1Index].promptVoice);
        } else {
          this.goScreen('mode2');
        }
      },

              </span>
              <button onclick="app.repeatVoice()" class="px-4 py-2.5 rounded-2xl bg-amber-400 text-naqi-forest font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow">
                <span class="text-lg anim-speaker">🔊</span>
                <span>OUVIR PERGUNTA</span>
              </button>
            </div>

            <div class="bg-naqi-paper rounded-3xl p-4 border-2 border-naqi-forest/10 space-y-1">

            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              ${round.options.map(optId => {
                const animal = ANIMALS_DATA.find(a => a.id === optId);
                const isWin = this.state.m1Solved && optId === round.correctId;
                const isWrong = this.state.m1WrongId === optId;

                let cls = 'bg-naqi-paper border-naqi-forest/20';
                if (isWin) cls = 'bg-emerald-100 border-emerald-600 ring-4 ring-emerald-400 scale-[1.02]';
                else if (isWrong) cls = 'bg-amber-100 border-amber-500 anim-wiggle';

                return `
                  <button onclick="app.answerMode1('${optId}', event)" class="touch-card p-3 sm:p-4 border-4 shadow-md flex sm:flex-col items-center gap-3 ${cls}">
                    <div class="w-24 h-24 sm:w-full sm:h-36 rounded-2xl overflow-hidden shrink-0">
                      ${getCuteAnimalSVG(animal.id)}
                    </div>
                    <div class="text-lg sm:text-xl font-bold text-naqi-forest text-left sm:text-center">
                      ${isWin ? '⭐ ' : ''}${animal.name}
                    </div>
                  </button>
                `;
              }).join('')}
            </div>

            ${this.state.m1Solved ? `
              <button onclick="app.nextMode1()" class="touch-card w-full sm:w-auto px-9 py-4 bg-naqi-amazonia text-white font-bold text-xl sm:text-2xl shadow-xl flex items-center justify-center gap-3 mx-auto anim-hop">
                <span>🌟</span>
                <span>PRÓXIMO!</span>
                <span>➡️</span>
              </button>
            ` : ''}
          </section>
        `;
      },

      /**
       * =====================================================================
       * MODALIDADE 2 — HORA DO LANCHINHO! (ALIMENTAÇÃO)
       * =====================================================================
       */
      answerMode2(optId, isCorrect, ev) {
        const round = GAMES_CONFIG.mode2[this.state.m2Index];
        if (this.state.m2Solved) return;

        if (isCorrect) {
          this.state.m2Solved = true;
          this.state.m2WrongId = null;
          voiceEngine.playSound('success');
          if (ev) this.burstStars(ev.clientX, ev.clientY);
          if (this.state.m2Index === GAMES_CONFIG.mode2.length - 1) {
            this.state.stars.mode2 = true;
          }
          this.render();
          this.narrate(round.winVoice);
        } else {
          this.state.m2WrongId = optId;
          voiceEngine.playSound('gentleTry');
          this.render();
          this.narrate('Quase! Vamos experimentar outra comidinha!');
        }
      },

      nextMode2() {
        voiceEngine.playSound('tap');
        if (this.state.m2Index + 1 < GAMES_CONFIG.mode2.length) {
          this.state.m2Index++;
          this.state.m2Solved = false;
          this.state.m2WrongId = null;
          this.render();
          this.narrate(GAMES_CONFIG.mode2[this.state.m2Index].promptVoice);
        } else {
          this.goScreen('mode3');
        }
      },

      renderMode2() {
        const round = GAMES_CONFIG.mode2[this.state.m2Index];
        const animal = ANIMALS_DATA.find(a => a.id === round.animalId);

        return `
          <section class="bg-white border-4 border-naqi-forest/15 rounded-[34px] p-4 sm:p-7 shadow-xl space-y-5 text-center">
            <div class="flex items-center justify-between gap-2">
              <span class="px-3.5 py-1.5 rounded-full bg-amber-100 text-naqi-forest font-bold text-xs sm:text-sm">
                🍓 LANCHINHO • ${this.state.m2Index + 1}/${GAMES_CONFIG.mode2.length}
              </span>
              <button onclick="app.repeatVoice()" class="px-4 py-2.5 rounded-2xl bg-amber-400 text-naqi-forest font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow">
                <span class="text-lg anim-speaker">🔊</span>
                <span>OUVIR</span>
              </button>
            </div>

            <div class="max-w-sm mx-auto bg-naqi-paper rounded-[28px] p-3.5 border-4 border-naqi-forest/10 space-y-1.5">
              <div class="h-36 sm:h-40 rounded-2xl overflow-hidden ${this.state.m2Solved ? 'anim-hop' : ''}">
                ${getCuteAnimalSVG(animal.id)}
              </div>
              <h2 class="text-xl sm:text-2xl font-bold text-naqi-forest">
                ${this.state.m2Solved ? `😋 NHAM! ${animal.shortName} ADOROU!` : round.promptTitle}
              </h2>
            </div>

            <div class="grid grid-cols-3 gap-2.5 sm:gap-4 max-w-xl mx-auto">
              ${round.options.map(opt => {
                const isWin = this.state.m2Solved && opt.correct;
                const isWrong = this.state.m2WrongId === opt.id;

                let cls = 'bg-naqi-paper border-naqi-forest/20';
                if (isWin) cls = 'bg-emerald-100 border-emerald-600 ring-4 ring-emerald-400 scale-[1.03]';
                else if (isWrong) cls = 'bg-amber-100 border-amber-500 anim-wiggle';

                return `
                  <button onclick="app.answerMode2('${opt.id}', ${opt.correct}, event)" class="touch-card p-3 sm:p-5 border-4 shadow-md flex flex-col items-center justify-center gap-2 ${cls}">
                    <span class="text-4xl sm:text-6xl">${opt.icon}</span>
                    <span class="text-xs sm:text-base font-bold text-naqi-forest leading-tight">
                      ${isWin ? '⭐ ' : ''}${opt.label}
                    </span>
                  </button>
                `;
              }).join('')}
            </div>

            ${this.state.m2Solved ? `
              <button onclick="app.nextMode2()" class="touch-card w-full sm:w-auto px-9 py-4 bg-naqi-amazonia text-white font-bold text-xl sm:text-2xl shadow-xl flex items-center justify-center gap-3 mx-auto anim-hop">
                <span>🌟</span>
                <span>PRÓXIMO!</span>
                <span>➡️</span>
              </button>
            ` : ''}
          </section>
        `;
      },

      /**
       * =====================================================================
       * MODALIDADE 3 (NOVA) — QUEM FAZ ESSE SOM E JEITINHO? (ADIVINHA SENSORIAL)
       * =====================================================================
       */
      answerMode3(pickedId, ev) {
        const round = GAMES_CONFIG.mode3[this.state.m3Index];
        if (this.state.m3Solved) return;

        if (pickedId === round.animalId) {
          this.state.m3Solved = true;
          this.state.m3WrongId = null;
          voiceEngine.playSound('success');
          if (ev) this.burstStars(ev.clientX, ev.clientY);
          if (this.state.m3Index === GAMES_CONFIG.mode3.length - 1) {
            this.state.stars.mode3 = true;
          }
          this.render();
          this.narrate(round.winVoice);
        } else {
          const wrongAnimal = ANIMALS_DATA.find(a => a.id === pickedId);
          this.state.m3WrongId = pickedId;
          voiceEngine.playSound('gentleTry');
          this.render();
          this.narrate(`Quase! Esse é o ${wrongAnimal.shortName}. Escute a dica de novo e tente outra vez!`);
        }
      },

      nextMode3() {
        voiceEngine.playSound('tap');
        if (this.state.m3Index + 1 < GAMES_CONFIG.mode3.length) {
          this.state.m3Index++;
          this.state.m3Solved = false;
          this.state.m3WrongId = null;
          const nextAnimal = ANIMALS_DATA.find(a => a.id === GAMES_CONFIG.mode3[this.state.m3Index].animalId);
          this.render();
          this.narrate(`Adivinha quem é! ${nextAnimal.sensoryClue}`);
        } else {
          this.goScreen('mode4');
        }
      },

      renderMode3() {
        const round = GAMES_CONFIG.mode3[this.state.m3Index];
        const targetAnimal = ANIMALS_DATA.find(a => a.id === round.animalId);

        return `
          <section class="bg-white border-4 border-naqi-forest/15 rounded-[34px] p-4 sm:p-7 shadow-xl space-y-5 text-center">
            <div class="flex items-center justify-between gap-2">
              <span class="px-3.5 py-1.5 rounded-full bg-amber-100 text-naqi-forest font-bold text-xs sm:text-sm">
                👂 ADIVINHA • ${this.state.m3Index + 1}/${GAMES_CONFIG.mode3.length}
              </span>
              <button onclick="app.repeatVoice()" class="px-4 py-2.5 rounded-2xl bg-amber-400 text-naqi-forest font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow">
                <span class="text-lg anim-speaker">🔊</span>
                <span>OUVIR DICA</span>
              </button>
            </div>

            <!-- Cartão de Pista Sonora e Sensorial -->
            <div class="bg-naqi-paper rounded-3xl p-4 sm:p-5 border-2 border-naqi-forest/10 space-y-2">
              <div class="inline-block px-4 py-1.5 rounded-full bg-naqi-terracotta text-white font-bold text-sm sm:text-lg">
                🎵 "${targetAnimal.soundCue}"
              </div>
              <h2 class="text-lg sm:text-2xl font-bold text-naqi-forest leading-snug">
                ${targetAnimal.sensoryClue}
              </h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              ${round.options.map(optId => {
                const animal = ANIMALS_DATA.find(a => a.id === optId);
                const isWin = this.state.m3Solved && optId === round.animalId;
                const isWrong = this.state.m3WrongId === optId;

                let cls = 'bg-naqi-paper border-naqi-forest/20';
                if (isWin) cls = 'bg-emerald-100 border-emerald-600 ring-4 ring-emerald-400 scale-[1.02]';
                else if (isWrong) cls = 'bg-amber-100 border-amber-500 anim-wiggle';

                return `
                  <button onclick="app.answerMode3('${optId}', event)" class="touch-card p-3 sm:p-4 border-4 shadow-md flex sm:flex-col items-center gap-3 ${cls}">
                    <div class="w-24 h-24 sm:w-full sm:h-36 rounded-2xl overflow-hidden shrink-0">
                      ${getCuteAnimalSVG(animal.id)}
                    </div>
                    <div class="text-lg sm:text-xl font-bold text-naqi-forest text-left sm:text-center">
                      ${isWin ? '⭐ ' : ''}${animal.name}
                    </div>
                  </button>
                `;
              }).join('')}
            </div>

            ${this.state.m3Solved ? `
              <button onclick="app.nextMode3()" class="touch-card w-full sm:w-auto px-9 py-4 bg-naqi-amazonia text-white font-bold text-xl sm:text-2xl shadow-xl flex items-center justify-center gap-3 mx-auto anim-hop">
                <span>🌟</span>
                <span>PRÓXIMO!</span>
                <span>➡️</span>
              </button>
            ` : ''}
          </section>
        `;
      },

      /**
       * =====================================================================
       * MODALIDADE 4 (NOVA) — JOGO DA MEMÓRIA DOS BICHINHOS (6 CARTAS GRANDES)
       * =====================================================================
       */
      setupMemoryBoard() {
        const pairIds = GAMES_CONFIG.mode4.pairs;
        const deck = [...pairIds, ...pairIds].map((animalId, index) => ({
          uid: index,
          animalId
        }));
        // Embaralhamento Fisher-Yates
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        this.state.m4Cards = deck;
        this.state.m4Flipped = [];
        this.state.m4Matched = [];
        this.state.m4Lock = false;
      },

      flipMemoryCard(uid, ev) {
        if (this.state.m4Lock) return;
        if (this.state.m4Flipped.includes(uid) || this.state.m4Matched.includes(uid)) return;

        const card = this.state.m4Cards.find(c => c.uid === uid);
        if (!card) return;

        voiceEngine.playSound('flip');
        const animal = ANIMALS_DATA.find(a => a.id === card.animalId);
        this.narrate(animal.shortName);

        this.state.m4Flipped.push(uid);
        this.render();

        if (this.state.m4Flipped.length === 2) {
          this.state.m4Lock = true;
          const [firstUid, secondUid] = this.state.m4Flipped;
          const firstCard = this.state.m4Cards.find(c => c.uid === firstUid);
          const secondCard = this.state.m4Cards.find(c => c.uid === secondUid);

          if (firstCard.animalId === secondCard.animalId) {
            setTimeout(() => {
              this.state.m4Matched.push(firstUid, secondUid);
              this.state.m4Flipped = [];
              this.state.m4Lock = false;
              voiceEngine.playSound('success');
              if (ev) this.burstStars(ev.clientX, ev.clientY);

              const allDone = this.state.m4Matched.length === this.state.m4Cards.length;
              if (allDone) {
                this.state.stars.mode4 = true;
                this.render();
                this.narrate(`Eba! Você encontrou o par de ${animal.shortName} e completou todo o jogo da memória! Parabéns!`);
              } else {
                this.render();
                this.narrate(`Que legal! Você encontrou o par de ${animal.shortName}!`);
              }
            }, 450);
          } else {
            setTimeout(() => {
              this.state.m4Flipped = [];
              this.state.m4Lock = false;
              voiceEngine.playSound('gentleTry');
              this.render();
            }, 950);
          }
        }
      },

      renderMode4() {
        const allMatched = this.state.m4Matched.length === this.state.m4Cards.length && this.state.m4Cards.length > 0;
        const pairsFound = this.state.m4Matched.length / 2;

        return `
          <section class="bg-white border-4 border-naqi-forest/15 rounded-[34px] p-4 sm:p-7 shadow-xl space-y-5 text-center">
            <div class="flex items-center justify-between gap-2">
              <span class="px-3.5 py-1.5 rounded-full bg-amber-100 text-naqi-forest font-bold text-xs sm:text-sm">
                🃏 MEMÓRIA • PARES: ${pairsFound}/3
              </span>
              <button onclick="app.repeatVoice()" class="px-4 py-2.5 rounded-2xl bg-amber-400 text-naqi-forest font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow">
                <span class="text-lg anim-speaker">🔊</span>
                <span>OUVIR</span>
              </button>
            </div>

            <h2 class="text-xl sm:text-3xl font-bold text-naqi-forest">
              ${allMatched ? '🎉 VOCÊ ENCONTROU TODOS OS PARES!' : 'ENCONTRE OS BICHINHOS IGUAIS!'}
            </h2>

            <!-- Grade 2x3 no celular e 3x2 no tablet/desktop com cartas enormes -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4 max-w-xl mx-auto">
              ${this.state.m4Cards.map(card => {
                const isFlipped = this.state.m4Flipped.includes(card.uid);
                const isMatched = this.state.m4Matched.includes(card.uid);
                const animal = ANIMALS_DATA.find(a => a.id === card.animalId);

                if (isFlipped || isMatched) {
                  return `
                    <div class="memory-tile p-2.5 sm:p-3 border-4 flex flex-col items-center justify-between shadow-md ${isMatched ? 'bg-emerald-100 border-emerald-600' : 'bg-white border-naqi-terracotta'}">
                      <div class="w-full flex-grow rounded-2xl overflow-hidden">
                        ${getCuteAnimalSVG(animal.id)}
                      </div>
                      <div class="text-sm sm:text-base font-bold text-naqi-forest pt-1">
                        ${isMatched ? '⭐ ' : ''}${animal.shortName}
                      </div>
                    </div>
                  `;
                }

                return `
                  <button onclick="app.flipMemoryCard(${card.uid}, event)" class="memory-tile bg-naqi-forest border-4 border-naqi-terracotta shadow-lg flex flex-col items-center justify-center gap-1 text-white" aria-label="Virar carta">
                    <span class="text-4xl sm:text-5xl">🌿</span>
                    <span class="text-xs font-bold tracking-wider text-amber-200">TOCAR</span>
                  </button>
                `;
              }).join('')}
            </div>

            ${allMatched ? `
              <div class="pt-2">
                <button onclick="app.goScreen('celebration')" class="touch-card w-full sm:w-auto px-9 py-4 bg-naqi-terracotta text-white font-bold text-xl sm:text-2xl shadow-xl flex items-center justify-center gap-3 mx-auto anim-hop">
                  <span>🏆</span>
                  <span>PEGAR MEU TROFÉU!</span>
                </button>
              </div>
            ` : ''}
          </section>
        `;
      },

      /**
       * =====================================================================
       * TELA FINAL DE CELEBRAÇÃO
       * =====================================================================
       */
      renderCelebration() {
        return `
          <section class="bg-white border-4 border-naqi-terracotta rounded-[34px] p-5 sm:p-9 shadow-2xl text-center space-y-5">
            <div class="text-4xl sm:text-5xl space-x-2">
              <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span>
            </div>

            <div class="w-36 h-36 sm:w-44 sm:h-44 mx-auto anim-float">
              <svg viewBox="0 0 160 160" class="w-full h-full drop-shadow-lg">
                <circle cx="80" cy="80" r="72" fill="#FACC15" stroke="#173B32" stroke-width="5"/>
                <circle cx="80" cy="80" r="58" fill="#FFFBEB" stroke="#C86D51" stroke-width="3" stroke-dasharray="6,4"/>
                <text x="80" y="78" text-anchor="middle" font-size="48">🏆</text>
                <rect x="20" y="106" width="120" height="26" rx="13" fill="#173B32"/>
                <text x="80" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">EXPLORADOR(A)!</text>
              </svg>
            </div>

            <h1 class="text-2xl sm:text-4xl font-bold text-naqi-forest leading-tight">
              PARABÉNS, PEQUENO EXPLORADOR DA NATUREZA!
            </h1>

            <div class="flex justify-center gap-2 sm:gap-4 text-3xl sm:text-5xl">
              <span>🐬</span><span>🦜</span><span>🐺</span><span>🐒</span><span>🦩</span><span>🦌</span>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
              <button onclick="app.restartFullGame()" class="touch-card w-full sm:w-auto px-8 py-4 bg-naqi-amazonia text-white font-bold text-xl sm:text-2xl shadow-xl flex items-center justify-center gap-3">
                <span>🔄</span>
                <span>BRINCAR DE NOVO!</span>
              </button>

              <button onclick="app.repeatVoice()" class="touch-card w-full sm:w-auto px-6 py-4 bg-amber-400 text-naqi-forest font-bold text-lg flex items-center justify-center gap-2 shadow">
                <span class="text-2xl anim-speaker">🔊</span>
                <span>OUVIR PARABÉNS</span>
              </button>
            </div>
          </section>
        `;
      },

      restartFullGame() {
        this.state.stars = { mode1: false, mode2: false, mode3: false, mode4: false };
        this.setupMemoryBoard();
        this.goScreen('home');
      },

      /**
       * =====================================================================
       * MODAL DE SELEÇÃO DE VOZ NATURAL (PARA PAIS / EDUCADORES)
       * =====================================================================
       */
      openVoiceSettings() {
        voiceEngine.unlockMobileAudio();
        voiceEngine.loadVoices();
        const modal = document.getElementById('voice-modal');
        const body = document.getElementById('voice-modal-body');

        const activeVoice = voiceEngine.getActiveVoice();
        const profilesHTML = [
          { id: 'feminina', label: 'Voz feminina' },
          { id: 'masculina', label: 'Voz masculina' }
        ].map(profile => {
          const selected = !voiceEngine.selectedVoiceURI && voiceEngine.speakerProfile === profile.id;
          return `
            <button onclick="app.chooseVoiceProfile('${profile.id}')" class="flex-1 p-3 rounded-2xl border-2 text-sm font-bold ${selected ? 'bg-naqi-forest text-white border-naqi-forest' : 'bg-white text-naqi-forest border-naqi-forest/15'}">
              ${profile.label}${selected ? ' ✓' : ''}
            </button>
          `;
        }).join('');
        const listHTML = voiceEngine.voices.length > 0
          ? voiceEngine.voices.map(v => {
              const selected = activeVoice && v.voiceURI === activeVoice.voiceURI;
              return `
                <button onclick="app.chooseVoice('${v.voiceURI.replace(/'/g, "\\'")}')" class="w-full p-3.5 rounded-2xl border-2 text-left text-sm font-bold flex items-center justify-between gap-2 ${selected ? 'bg-naqi-forest text-white border-naqi-forest' : 'bg-white text-naqi-forest border-naqi-forest/15'}">
                  <span class="truncate">${v.name}</span>
                  <span>${selected ? '✓' : '🔊'}</span>
                </button>
              `;
            }).join('')
          : `<div class="p-4 rounded-2xl bg-white text-sm text-naqi-forest">A narração usa as vozes disponíveis no navegador e no dispositivo.</div>`;
        const supportMessage = !voiceEngine.isSpeechSupported()
          ? 'Este navegador não oferece narração por voz. Use uma versão atual do Chrome ou Microsoft Edge.'
          : voiceEngine.lastSpeechStatus || 'As vozes variam conforme as opções instaladas no dispositivo. Para melhor resultado, habilite uma voz em Português (Brasil).';

        body.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-xl font-bold text-naqi-forest">🗣️ Escolher Voz</h3>
              <button onclick="app.closeVoiceSettings()" class="w-11 h-11 rounded-2xl bg-naqi-terracotta text-white font-bold text-xl">✕</button>
            </div>
            <p class="text-xs text-naqi-forest/80">
              Escolha uma voz e toque para ouvir uma amostra. A fala é leve e natural; as opções dependem das vozes instaladas no dispositivo.
            </p>
            <div class="flex gap-2">${profilesHTML}</div>
            <p id="voice-settings-status" class="text-xs text-naqi-forest/75" role="status" aria-live="polite">${supportMessage}</p>
            <div class="text-[11px] font-bold uppercase tracking-wider text-naqi-forest/60">Outras vozes do dispositivo</div>
            <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
              ${listHTML}
            </div>
            <button onclick="app.closeVoiceSettings()" class="touch-card w-full py-3.5 bg-naqi-amazonia text-white font-bold text-base">
              PRONTO!
            </button>
          </div>
        `;

        modal.classList.remove('hidden');
        modal.classList.add('flex');
      },

      chooseVoice(uri) {
        voiceEngine.setVoiceByURI(uri);
        this.openVoiceSettings();
      },

      chooseVoiceProfile(profile) {
        voiceEngine.setSpeakerProfile(profile);
        this.openVoiceSettings();
      },

      closeVoiceSettings() {
        const modal = document.getElementById('voice-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    };

    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
