name: Validate website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check static site files
        run: |
          test -s index.html
          test -s servicos/index.html
          test -s servicos/servicos.css
          test -s servicos/diagnostico-planejamento-sustentabilidade/index.html
          test -s servicos/projetos-descarbonizacao/index.html
          test -s servicos/pesquisa-palestras-treinamentos/index.html
          test -s servicos/inovacao-ambiental/index.html
          test -s servicos/editais-financiamento-inovacao/index.html
          test -s servicos/projetos-colaborativos/index.html
          test -s CONTENT_AUDIT.md
          test -s politica-de-privacidade.html
          test -f .nojekyll
          test -f CNAME
          test -f assets/favicon.ico
          test -s robots.txt
          test -s sitemap.xml
          test -s projetos/expedicao-pelos-biomas/index.html
          test -s projetos/expedicao-pelos-biomas/css/expedicao.css
          test -s projetos/expedicao-pelos-biomas/kids/index.html
          test -s projetos/expedicao-pelos-biomas/adulto/index.html
